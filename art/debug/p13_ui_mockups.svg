    <text x="288" y="284" text-anchor="middle" class="caption">NEW GAME / TOUCH-SAFE FORM</text>
  </g>

  <g transform="translate(640 744)">
    <rect width="608" height="292" rx="10" fill="#3b654b"/>
    <path d="M0 0 L608 42 L608 292 L0 292Z" fill="#b18b58" opacity=".40"/>
    <rect x="44" y="64" width="520" height="196" rx="10" class="panel"/>
    <rect x="62" y="84" width="60" height="60" fill="#293745" stroke="#d0a45b"/>
    <text x="92" y="121" text-anchor="middle" class="gold" font-size="22">H</text>
    <text x="140" y="99" class="gold" font-size="16">Halven</text>
    <text x="140" y="122" class="text" font-size="13">La plaza se ha quedado tranquila. La linterna</text>
    <text x="140" y="142" class="text" font-size="13">está lista; regresa con Iria cuando termines.</text>
