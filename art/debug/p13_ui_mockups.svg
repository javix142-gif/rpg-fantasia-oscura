    <text x="304" y="198" text-anchor="middle" class="muted" font-size="13">La linterna vuelve a manos de Iria.</text>
    <rect x="186" y="218" width="236" height="28" rx="6" fill="#1b2630" stroke="#6e8b78"/>
    <text x="304" y="237" text-anchor="middle" class="text" font-size="12">Explora Liria.</text>
    <text x="304" y="284" text-anchor="middle" class="caption">QUEST FEEDBACK / CLEAR NEXT ACTIVITY</text>
  </g>

  <g transform="translate(32 744)">
    <rect width="576" height="292" rx="10" fill="#182d2b"/>
    <rect width="576" height="292" rx="10" fill="#071016" opacity=".42"/>
    <text x="288" y="44" text-anchor="middle" class="gold" font-size="24" font-weight="bold">NUEVA PARTIDA</text>
