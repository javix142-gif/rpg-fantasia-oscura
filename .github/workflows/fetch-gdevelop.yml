name: Fetch GDevelop 5.6.282

on:
  push:
    branches:
      - "tooling/gdevelop-5.6.282-download"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download official GDevelop AppImage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -fL --retry 3 --retry-delay 2 \
            -o out/GDevelop-5-5.6.282.AppImage \
            https://github.com/4ian/GDevelop/releases/download/v5.6.282/GDevelop-5-5.6.282.AppImage
          echo "7ef0a1e065561f7ee69fbb699d35ccb3c274ffca34ddb8351f5670d89b692b79  out/GDevelop-5-5.6.282.AppImage" | sha256sum -c -
          chmod +x out/GDevelop-5-5.6.282.AppImage
          ls -lh out/GDevelop-5-5.6.282.AppImage

      - name: Upload GDevelop AppImage
        uses: actions/upload-artifact@v4
        with:
          name: GDevelop-5-5.6.282-AppImage
          path: out/GDevelop-5-5.6.282.AppImage
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
