name: Build Survival Prototype APK

on:
  push:
    branches:
      - artifact/survival-2d-apk-20260915
    paths:
      - survival_prototype/**

permissions:
  actions: read
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GODOT_VERSION: "4.7.2"
      XDG_DATA_HOME: ${{ github.workspace }}/.ci-data
      XDG_CONFIG_HOME: ${{ github.workspace }}/.ci-config

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify Java and Android SDK
        shell: bash
        run: |
          set -euo pipefail
          java -version
          JAVA_MAJOR="$(java -version 2>&1 | sed -n 's/.*version "\([0-9][0-9]*\).*/\1/p' | head -n1)"
          if [[ "$JAVA_MAJOR" != "17" ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y openjdk-17-jdk
          fi
          JAVA_BIN="$(readlink -f "$(command -v java)")"
          JAVA_HOME_ACTUAL="$(dirname "$(dirname "$JAVA_BIN")")"
          echo "JAVA_HOME_ACTUAL=$JAVA_HOME_ACTUAL" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -d "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

      - name: Ensure Android APIs and Build Tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" >/dev/null
          "$SDK_ROOT/build-tools/35.0.0/aapt" version
          "$SDK_ROOT/build-tools/35.0.0/apksigner" version

      - name: Install verified Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_ZIP="$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64.zip"
          TEMPLATES="$RUNNER_TEMP/Godot_v4.7.2-stable_export_templates.tpz"
          curl -fL --retry 5 --retry-delay 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o "$GODOT_ZIP"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $GODOT_ZIP" | sha256sum -c -
          curl -fL --retry 5 --retry-delay 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" \
            -o "$TEMPLATES"
          echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  $TEMPLATES" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/template-stage" "$XDG_DATA_HOME/godot/export_templates/4.7.2.stable"
          unzip -q "$GODOT_ZIP" -d "$RUNNER_TEMP/godot"
          unzip -q "$TEMPLATES" -d "$RUNNER_TEMP/template-stage"
          cp -a "$RUNNER_TEMP/template-stage/templates/." "$XDG_DATA_HOME/godot/export_templates/4.7.2.stable/"
          GODOT_BIN="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version
          test -f "$XDG_DATA_HOME/godot/export_templates/4.7.2.stable/android_source.zip"

      - name: Configure Godot Android paths and import project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          "$GODOT_BIN" --headless --editor --quit --path "$GITHUB_WORKSPACE/survival_prototype" 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" "$RUNNER_TEMP/godot-import.log"; then
            exit 1
          fi
          SETTINGS="$XDG_CONFIG_HOME/godot/editor_settings-4.7.tres"
          test -f "$SETTINGS"
          set_path() {
            local key="$1" value="$2"
            if grep -q "^${key} =" "$SETTINGS"; then
              sed -i "s|^${key} =.*|${key} = \"${value}\"|" "$SETTINGS"
            else
              printf '%s = "%s"\n' "$key" "$value" >> "$SETTINGS"
            fi
          }
          set_path "export/android/android_sdk_path" "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          set_path "export/android/java_sdk_path" "$JAVA_HOME_ACTUAL"

      - name: Install Android Gradle build template
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_DIR="$GITHUB_WORKSPACE/survival_prototype/android"
          rm -rf "$ANDROID_DIR"
          mkdir -p "$ANDROID_DIR/build" "$ANDROID_DIR/plugins"
          unzip -q "$XDG_DATA_HOME/godot/export_templates/4.7.2.stable/android_source.zip" -d "$ANDROID_DIR/build"
          printf '%s\n' "4.7.2.stable" > "$ANDROID_DIR/.build_version"
          touch "$ANDROID_DIR/build/.gdignore"
          test "$(tr -d '\r\n' < "$ANDROID_DIR/.build_version")" = "4.7.2.stable"
          test -f "$ANDROID_DIR/build/gradlew"
          chmod +x "$ANDROID_DIR/build/gradlew"
          test -f "$ANDROID_DIR/build/config.gradle"

      - name: Create debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Ceniza Salvaje Debug,O=OpenAI Build,C=CL" \
            -keyalg RSA -keysize 2048 -validity 10000 >/dev/null 2>&1

      - name: Export Android compatibility APK with Gradle
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/survival_prototype/build/Ceniza-Salvaje-compat-debug.apk"
          mkdir -p "$(dirname "$OUT")"
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE/survival_prototype" \
            --export-debug "Android" "$OUT" 2>&1 | tee "$RUNNER_TEMP/godot-export.log"
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|Export failed|BUILD FAILED" "$RUNNER_TEMP/godot-export.log"; then
            exit 1
          fi
          test -s "$OUT"

      - name: Independently verify compatibility APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$GITHUB_WORKSPACE/survival_prototype/build"
          APK="$BUILD/Ceniza-Salvaje-compat-debug.apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT="$SDK_ROOT/build-tools/35.0.0"

          "$BT/aapt" dump badging "$APK" | tee "$BUILD/aapt-badging-compat.txt"
          grep -F "package: name='org.cenizasalvaje.prototype.compat'" "$BUILD/aapt-badging-compat.txt"
          grep -F "sdkVersion:'24'" "$BUILD/aapt-badging-compat.txt"
          grep -F "targetSdkVersion:'35'" "$BUILD/aapt-badging-compat.txt"
          grep -F "arm64-v8a" "$BUILD/aapt-badging-compat.txt"
          grep -F "armeabi-v7a" "$BUILD/aapt-badging-compat.txt"

          "$BT/aapt" dump xmltree "$APK" AndroidManifest.xml | tee "$BUILD/manifest-tree-compat.txt"
          grep -F "android.intent.action.MAIN" "$BUILD/manifest-tree-compat.txt"
          grep -F "android.intent.category.LAUNCHER" "$BUILD/manifest-tree-compat.txt"

          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee "$BUILD/signature-compat.txt"
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" "$BUILD/signature-compat.txt"
          "$BT/zipalign" -c -P 16 -v 4 "$APK" > "$BUILD/zipalign-compat.txt"
          unzip -tq "$APK"

          mapfile -t ABIS < <(zipinfo -1 "$APK" | awk -F/ '/^lib\/[^/]+\//{print $2}' | sort -u)
          printf 'ABIS=%s\n' "${ABIS[*]}"
          [[ " ${ABIS[*]} " == *" arm64-v8a "* ]]
          [[ " ${ABIS[*]} " == *" armeabi-v7a "* ]]

          cd "$BUILD"
          sha256sum Ceniza-Salvaje-compat-debug.apk | tee SHA256-COMPAT.txt
          SIZE="$(stat -c '%s' Ceniza-Salvaje-compat-debug.apk)"
          SHA="$(awk '{print $1}' SHA256-COMPAT.txt)"
          {
            echo "BUILD_STATUS=PASS"
            echo "APK=Ceniza-Salvaje-compat-debug.apk"
            echo "PACKAGE=org.cenizasalvaje.prototype.compat"
            echo "GODOT=4.7.2.stable"
            echo "BUILD_SYSTEM=Gradle"
            echo "MIN_SDK=24"
            echo "TARGET_SDK=35"
            echo "ABI=armeabi-v7a+arm64-v8a"
            echo "SIZE_BYTES=$SIZE"
            echo "SHA256=$SHA"
            echo "SIGNATURE=debug v2 verified"
            echo "ZIP_INTEGRITY=PASS"
            echo "ZIPALIGN_16K=PASS"
          } | tee APK_METADATA_COMPAT.txt

      - name: Upload verified compatibility APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Ceniza-Salvaje-compat-android-debug
          path: |
            survival_prototype/build/Ceniza-Salvaje-compat-debug.apk
            survival_prototype/build/SHA256-COMPAT.txt
            survival_prototype/build/APK_METADATA_COMPAT.txt
            survival_prototype/build/aapt-badging-compat.txt
            survival_prototype/build/manifest-tree-compat.txt
            survival_prototype/build/signature-compat.txt
            survival_prototype/build/zipalign-compat.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish compatibility APK as prerelease asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ceniza-salvaje-prototype-v0.1.1-compat
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/survival_prototype/build/Ceniza-Salvaje-compat-debug.apk"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "$APK" \
              --repo "${{ github.repository }}" \
              --target "artifact/survival-2d-apk-20260915" \
              --title "Ceniza Salvaje Prototype v0.1.1 Compat" \
              --notes "APK de compatibilidad: Gradle, minSdk 24, targetSdk 35, ARM32 + ARM64, paquete alternativo para instalación limpia." \
              --prerelease
          fi
