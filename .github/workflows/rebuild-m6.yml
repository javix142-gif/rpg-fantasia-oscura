name: Reconstructed M6 Android Gate

on:
  push:
    branches: ["rebuild-f2-m6"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GODOT_VERSION: "4.7.2"
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      APK: ${{ github.workspace }}/builds/android/ilyrion_reconstructed_m6.apk
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36 / Build Tools 36.1.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL --retry 3 -o /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          unzip -q /tmp/cmdline.zip -d /tmp/android-cli
          mv /tmp/android-cli/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "build-tools;36.1.0"
          export PATH="$ANDROID_HOME/build-tools/36.1.0:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.1.0" >> "$GITHUB_PATH"
          aapt version
          apksigner version

      - name: Install Godot 4.7.2 and official export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -maxdepth 2 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' | head -1)"
          chmod +x "$GODOT_BIN"
          sudo ln -sf "$GODOT_BIN" /usr/local/bin/godot
          godot --version
          curl -fL --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          rm -rf /tmp/tpl && mkdir -p /tmp/tpl
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          TPL_SRC="$(dirname "$(find /tmp/tpl -type f -name android_debug.apk | head -1)")"
          test -n "$TPL_SRC"
          TPL_DEST="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TPL_DEST"
          cp -a "$TPL_SRC"/. "$TPL_DEST"/
          test -f "$TPL_DEST/android_debug.apk"
          test -f "$TPL_DEST/android_source.zip"

      - name: Configure Godot Android paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Godot 4.7.2 import and compile check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_logs
          godot --headless --path game --import --quit 2>&1 | tee ci_logs/import.log
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|Invalid call' ci_logs/import.log; then
            echo IMPORT_COMPILE_GATE=FAIL
            exit 1
          fi
          echo IMPORT_COMPILE_GATE=PASS

      - name: F2-F5 + M4-M6 deterministic regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path game --script res://rebuild/reconstruction_test.gd 2>&1 | tee ci_logs/reconstruction_test.log
          grep -q 'RECONSTRUCTION_M4_M6_TEST=PASS' ci_logs/reconstruction_test.log
          echo F2_F5_M4_M6_REGRESSION=PASS

      - name: Install Godot Gradle build template
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path game --install-android-build-template --quit 2>&1 | tee ci_logs/android_template.log
          test -d game/android/build
          echo ANDROID_BUILD_TEMPLATE=PASS

      - name: Android debug export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds/android
          godot --headless --path game --export-debug Android "$APK" 2>&1 | tee ci_logs/android_export.log
          test -s "$APK"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|Invalid call|ERROR:.*export' ci_logs/android_export.log; then
            echo ANDROID_EXPORT=FAIL
            exit 1
          fi
          echo ANDROID_EXPORT=PASS

      - name: aapt / ABI / ZIP / apksigner / SHA-256
        shell: bash
        run: |
          set -euo pipefail
          REPORT=builds/android/BUILD_REPORT_M6.txt
          : > "$REPORT"
          echo "CONTROLLED_RECONSTRUCTION=YES" | tee -a "$REPORT"
          echo "COMMIT=${GITHUB_SHA}" | tee -a "$REPORT"
          echo "GODOT=$(godot --version)" | tee -a "$REPORT"
          BADGING="$(aapt dump badging "$APK")"
          echo "$BADGING" | head -n 12 | tee -a "$REPORT"
          echo "$BADGING" | grep -q "package: name='cl.javix142.fantasiaoscura'"
          echo "$BADGING" | grep -q "sdkVersion:'28'"
          echo "$BADGING" | grep -q "targetSdkVersion:'36'"
          echo "AAPT=PASS" | tee -a "$REPORT"
          unzip -t "$APK" | tee ci_logs/zip_test.log
          grep -q 'No errors detected' ci_logs/zip_test.log
          echo "ZIP_INTEGRITY=PASS" | tee -a "$REPORT"
          unzip -l "$APK" | awk '{print $4}' | grep '^lib/' | cut -d/ -f2 | sort -u | tee ci_logs/abis.txt
          grep -qx 'arm64-v8a' ci_logs/abis.txt
          test "$(wc -l < ci_logs/abis.txt)" -eq 1
          echo "ABI_ARM64_ONLY=PASS" | tee -a "$REPORT"
          zipalign -c -v 4 "$APK" > ci_logs/zipalign.log
          echo "ZIPALIGN=PASS" | tee -a "$REPORT"
          apksigner verify --verbose --print-certs "$APK" | tee ci_logs/apksigner.log
          grep -q 'Verifies' ci_logs/apksigner.log
          echo "APKSIGNER=PASS" | tee -a "$REPORT"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          echo "APK_SHA256=$SHA" | tee -a "$REPORT"
          echo "$SHA  $(basename "$APK")" > builds/android/SHA256.txt
          echo "FINAL_ANDROID_GATE=PASS" | tee -a "$REPORT"

      - name: Upload final APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: ilyrion-reconstructed-m6-android
          if-no-files-found: error
          retention-days: 30
          path: |
            builds/android/ilyrion_reconstructed_m6.apk
            builds/android/BUILD_REPORT_M6.txt
            builds/android/SHA256.txt
            ci_logs/*.log
            ci_logs/abis.txt
