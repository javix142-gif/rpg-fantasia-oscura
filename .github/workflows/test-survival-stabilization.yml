name: Test Ceniza Salvaje v0.3 Stabilization

on:
  push:
    branches:
      - artifact/survival-v0.3-stabilization
    paths:
      - 'survival_prototype/**'
      - '.github/workflows/test-survival-stabilization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GODOT_VERSION: '4.7.2'
      XDG_DATA_HOME: ${{ github.workspace }}/.ci-data
      XDG_CONFIG_HOME: ${{ github.workspace }}/.ci-config
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install verified Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/Godot.zip"
          curl -fL --retry 5 "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o "$ZIP"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $ZIP" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Parse project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --quit --path "$GITHUB_WORKSPACE/survival_prototype" 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: Regression suite
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE/survival_prototype" --script res://tests/regression_runner.gd 2>&1 | tee "$RUNNER_TEMP/regression.log"
          grep -F "REGRESSION_RESULT=12/12 PASS" "$RUNNER_TEMP/regression.log"

      - name: Runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout 8s "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE/survival_prototype" > "$RUNNER_TEMP/smoke.log" 2>&1
          CODE=$?
          set -e
          cat "$RUNNER_TEMP/smoke.log"
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid get index|Attempt to call|ERROR:.*script" "$RUNNER_TEMP/smoke.log"; then exit 1; fi
          if [[ "$CODE" -ne 0 && "$CODE" -ne 124 ]]; then exit "$CODE"; fi
