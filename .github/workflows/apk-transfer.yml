name: APK Drive Transfer

on:
  push:
    branches: ["apk-transfer-m6"]
    paths: [".github/workflows/apk-transfer.yml"]

permissions:
  actions: read
  contents: write

jobs:
  publish-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ARTIFACT_ID: "10087386337"
      EXPECTED_SHA256: "7f26523fe700bd7b529ed9792e7e784f898f0a0b4c03a4b5ea07a47242a7fb4e"
      RELEASE_TAG: "m6-apk-drive-transfer"
    steps:
      - name: Download validated APK artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 5 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/artifact.zip
          rm -rf /tmp/apk-artifact && mkdir -p /tmp/apk-artifact
          unzip -q /tmp/artifact.zip -d /tmp/apk-artifact
          APK_SRC="$(find /tmp/apk-artifact -type f -name 'ilyrion_reconstructed_m6.apk' | head -1)"
          test -n "$APK_SRC"
          cp "$APK_SRC" /tmp/ilyrion_reconstructed_m6.apk
          test -s /tmp/ilyrion_reconstructed_m6.apk
          ACTUAL_SHA="$(sha256sum /tmp/ilyrion_reconstructed_m6.apk | awk '{print $1}')"
          echo "APK_SHA256=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA256"

      - name: Publish temporary prerelease asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$RELEASE_TAG" \
            /tmp/ilyrion_reconstructed_m6.apk#ilyrion_reconstructed_m6.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "41d6783de553e8873e1f68348386a69dbb0a7426" \
            --title "Ilyrion M6 APK transfer" \
            --notes "Temporary transfer asset for copying the already validated M6 APK to Google Drive." \
            --prerelease
          echo "APK_RELEASE_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/ilyrion_reconstructed_m6.apk"
