name: Package Ceniza Salvaje v0.3 stable review (no release)

on:
  push:
    branches: [artifact/survival-v0.3-stabilization]
    paths: [.github/workflows/package-survival-v03-stable-review.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout stabilization source and formal closure docs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Verify tested code remains unchanged and docs are complete
        shell: bash
        run: |
          set -euo pipefail
          TESTED=a417530ef3ae1f4f988f91f6e7733ab19564a8c7
          BASE=6c2d49a978ef6c1edcce8e41b4b2d931eefe590d
          test "$(git merge-base "$TESTED" HEAD)" = "$TESTED"
          git diff --check "$BASE" HEAD
          while IFS= read -r path; do
            case "$path" in
              PROJECT_STATE.md|SESSION_SUMMARY.md|survival_prototype/docs/FINAL_CLOSURE.md|.github/workflows/package-survival-v03-stable-review.yml) ;;
              *) echo "Runtime or out-of-scope change since QA: $path"; exit 1 ;;
            esac
          done < <(git diff --name-only "$TESTED" HEAD)
          for file in AGENTS.md PROJECT_STATE.md SESSION_SUMMARY.md survival_prototype/README.md survival_prototype/docs/ARCHITECTURE.md survival_prototype/docs/SAVE_FORMAT.md survival_prototype/docs/NAVIGATION_FUTURE.md survival_prototype/docs/FINAL_CLOSURE.md survival_prototype/project.godot survival_prototype/main.tscn survival_prototype/v03.gd; do test -s "$file"; done
          grep -F 'PASS_WITH_WARNINGS' PROJECT_STATE.md SESSION_SUMMARY.md survival_prototype/docs/FINAL_CLOSURE.md
          grep -F 'TOUCH_ANDROID_FISICO=NOT_VALIDATED' PROJECT_STATE.md survival_prototype/docs/FINAL_CLOSURE.md
          if git grep -nE '(sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16})' -- survival_prototype .github/workflows AGENTS.md PROJECT_STATE.md SESSION_SUMMARY.md; then echo 'Possible secret'; exit 1; fi
          test -z "$(git status --porcelain)"
          echo CODE_FREEZE=PASS
          echo DOCUMENTATION=PASS
          echo DIFF_REVIEW=PASS

      - name: Download and verify previously validated Android APK and seven screenshots
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ceniza-evidence" "$RUNNER_TEMP/ceniza-package"
          gh release download ceniza-salvaje-v0.3-stabilization-closure --repo "$GITHUB_REPOSITORY" --pattern 'Ceniza-Salvaje-v0.3-stabilization-arm64-debug.apk' --pattern 'Ceniza-Salvaje-v0.3-stabilization-screens.zip' --pattern 'QA_METADATA.txt' --dir "$RUNNER_TEMP/ceniza-evidence"
          APK="$RUNNER_TEMP/ceniza-evidence/Ceniza-Salvaje-v0.3-stabilization-arm64-debug.apk"
          SCREENS="$RUNNER_TEMP/ceniza-evidence/Ceniza-Salvaje-v0.3-stabilization-screens.zip"
          test "$(stat -c '%s' "$APK")" -eq 80188628
          echo '59bb2c39f917f8f50802b069d8b56f072fa7defc22b85e16775172e89552b21e  '"$APK" | sha256sum -c -
          unzip -tq "$APK"
          echo '0a3e3dacd38ee6c5ba26fc079c20b0921c56907009c815287190a74ade961b55  '"$SCREENS" | sha256sum -c -
          unzip -tq "$SCREENS"
          unzip -q "$SCREENS" -d "$RUNNER_TEMP/ceniza-evidence"
          test "$(find "$RUNNER_TEMP/ceniza-evidence/screenshots" -maxdepth 1 -name '*.png' | wc -l)" -eq 7
          grep -Fx 'REGRESSION=12/12 PASS' "$RUNNER_TEMP/ceniza-evidence/QA_METADATA.txt"
          grep -Fx 'FUNCTIONAL_INTEGRAL=25/25 PASS' "$RUNNER_TEMP/ceniza-evidence/QA_METADATA.txt"
          grep -Fx 'SAVE_END_TO_END=PASS' "$RUNNER_TEMP/ceniza-evidence/QA_METADATA.txt"
          grep -Fx 'SAVE_CORRUPTO=PASS' "$RUNNER_TEMP/ceniza-evidence/QA_METADATA.txt"
          grep -Fx 'ANDROID_DEVICE_TOUCH=NOT_VALIDATED' "$RUNNER_TEMP/ceniza-evidence/QA_METADATA.txt"
          echo EVIDENCE_VERIFIED=PASS

      - name: Create revision ZIP outside project and checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, re, subprocess, zipfile
          root = Path.cwd()
          evidence = Path(os.environ['RUNNER_TEMP']) / 'ceniza-evidence'
          output_dir = Path(os.environ['RUNNER_TEMP']) / 'ceniza-package'
          output = output_dir / 'Ceniza-Salvaje-v0.3-stable-review.zip'
          paths = [p for p in subprocess.check_output(['git', 'ls-files', '-z', 'survival_prototype', 'AGENTS.md', 'PROJECT_STATE.md', 'SESSION_SUMMARY.md']).decode().split('\0') if p]
          def forbidden(path):
              parts = Path(path).parts
              name = Path(path).name.lower()
              return any(x in {'.git', '.godot', '__pycache__', '.cache', 'build', 'android', 'logs', 'cache', 'tmp'} for x in parts) or name.startswith('.env') or name.endswith(('.keystore', '.jks', '.p12', '.pfx', '.key', '.pem', '.apk', '.aab', '.zip', '.log', '.pyc', '.pyo', '.tmp', '.bak'))
          included = []
          with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for path in paths:
                  if forbidden(path): continue
                  source = root / path
                  if not source.is_file() or source.is_symlink(): continue
                  if source.stat().st_size > 20_000_000: raise RuntimeError('Unexpected large file: ' + path)
                  data = source.read_bytes()
                  if re.search(rb'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}', data): raise RuntimeError('Secret indicator: ' + path)
                  z.writestr(path, data)
                  included.append(path)
              for png in sorted((evidence / 'screenshots').glob('*.png')):
                  z.write(png, 'review_evidence/screenshots/' + png.name)
              z.write(evidence / 'QA_METADATA.txt', 'review_evidence/QA_METADATA.txt')
              z.writestr('review_evidence/SOURCE_COMMIT.txt', 'REVIEW_COMMIT=' + os.environ['GITHUB_SHA'] + '\nTESTED_CODE_COMMIT=a417530ef3ae1f4f988f91f6e7733ab19564a8c7\n')
          with zipfile.ZipFile(output) as z:
              assert z.testzip() is None
              names = z.namelist()
              assert len([p for p in names if p.startswith('review_evidence/screenshots/') and p.endswith('.png')]) == 7
              assert all(p in names for p in ['survival_prototype/project.godot', 'survival_prototype/main.tscn', 'survival_prototype/v03.gd', 'survival_prototype/docs/FINAL_CLOSURE.md', 'survival_prototype/tests/regression_runner.gd', 'AGENTS.md', 'PROJECT_STATE.md', 'SESSION_SUMMARY.md'])
              assert not any(forbidden(p) for p in names)
          size = output.stat().st_size
          sha = hashlib.sha256(output.read_bytes()).hexdigest()
          manifest = output_dir / 'REVIEW_SHA256.txt'
          manifest.write_text(f'PATH={output}\nSIZE_BYTES={size}\nSHA256={sha}\nREVIEW_COMMIT={os.environ["GITHUB_SHA"]}\nTESTED_CODE_COMMIT=a417530ef3ae1f4f988f91f6e7733ab19564a8c7\nTRACKED_SOURCE_FILES={len(included)}\n')
          print(manifest.read_text())
          print('SOURCE_REVIEW_ZIP=PASS')
          PY
          unzip -tq "$RUNNER_TEMP/ceniza-package/Ceniza-Salvaje-v0.3-stable-review.zip"
          test -z "$(git status --porcelain)"

      - name: Upload review ZIP as Actions artifact only (no release or tag)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Ceniza-Salvaje-v0.3-stable-review
          path: |
            ${{ runner.temp }}/ceniza-package/Ceniza-Salvaje-v0.3-stable-review.zip
            ${{ runner.temp }}/ceniza-package/REVIEW_SHA256.txt
          if-no-files-found: error
          retention-days: 30
